global:
  scrape_interval: 60s
  evaluation_interval: 60s
  scrape_timeout: 30s
  external_labels:
    monitor: 'sonarqube-monitor'
    environment: 'production'

# Rule files
rule_files:
  # - "alerts.yml"

# Scrape configs
scrape_configs:
  # SonarQube Exporter
  - job_name: 'sonarqube-exporter'
    static_configs:
      - targets: ['sonarqube-exporter:8198']
    scrape_interval: 60s
    scrape_timeout: 30s
    metrics_path: '/metrics'
    
  # Optional: SonarQube Native Prometheus Endpoint (9.3+)
  - job_name: 'sonarqube-native'
    static_configs:
      - targets: ['your-sonarqube-enterprise.company.com']
    metrics_path: '/api/monitoring/metrics'
    scheme: https
    basic_auth:
      username: ''
      password: 'YOUR_SONARQUBE_TOKEN'
    scrape_interval: 60s
    scrape_timeout: 30s
    
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
